services:
  opnsense:
    image: ghcr.io/koichirok/docker-opnsense:${OPNSENSE_VERSION:?Set OPNSENSE_VERSION to a published GHCR tag}
    #devices:
    #  - /dev/kvm
    #  - /dev/net/tun
    device_cgroup_rules:
      - 'c 10:232 rwm'
    cap_add:
      - NET_ADMIN
    #init: true
    ports:
      - 10443:443
    stop_grace_period: 3m
    restart: on-failure
